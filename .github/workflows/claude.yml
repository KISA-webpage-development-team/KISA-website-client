name: Claude Code

# Runs Claude Code when "@claude" appears in an issue, an issue/PR comment,
# or a PR review. Claude implements changes on a branch; a separate step then
# opens a PR using CLAUDE_PR_PAT so that the pull_request event fires (the
# default GITHUB_TOKEN would not trigger the risk-label and Codex workflows).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when the "@claude" trigger phrase is present.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      # Open a draft PR with a PAT (so the risk-label workflow fires; PRs opened
      # by the default GITHUB_TOKEN do not trigger other workflows), then ask the
      # official Codex GitHub app to review via "@codex review" (works even while
      # the PR is a draft). On a fix run (the PR already exists, e.g. triggered by
      # the codex-bridge "@claude fix" comment), this re-requests a Codex review
      # of the new push instead of opening a second PR. The PAT is scoped to this
      # step only; it never authors commits.
      - name: Open draft PR or request Codex review
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PR_PAT }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_PR_NUM: ${{ github.event.issue.number }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CLAUDE_PR_PAT is not set; if a branch was pushed, open the PR manually."
            echo "Add the CLAUDE_PR_PAT secret to enable automatic PR creation."
            exit 0
          fi

          # Resolve an existing PR: by Claude's branch, or by the PR this comment is on.
          PR=""
          if [ -n "${BRANCH:-}" ] && gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            PR="$(gh pr view "$BRANCH" --json number --jq '.number')"
          elif [ -n "${ISSUE_PR_URL:-}" ] && [ -n "${ISSUE_PR_NUM:-}" ]; then
            PR="$ISSUE_PR_NUM"
          fi

          if [ -n "$PR" ]; then
            echo "PR #$PR already exists; requesting a fresh Codex review."
            gh pr comment "$PR" --body "@codex review"
            exit 0
          fi

          if [ -z "${BRANCH:-}" ]; then
            echo "No branch was created and this is not a PR comment; nothing to open."
            exit 0
          fi

          BASE="${BASE:-main}"

          # Classify risk deterministically from the changed files (does not depend
          # on Claude). Any sensitive path -> human-required; large diff -> complex;
          # otherwise simple. The sensitive set mirrors CLAUDE.md's "always
          # human-required" list. This is the human gate, so it is conservative.
          COMPARE="$(gh api "repos/${REPO}/compare/${BASE}...${BRANCH}" 2>/dev/null || echo '{}')"
          FILES="$(printf '%s' "$COMPARE" | jq -r '.files[]?.filename' 2>/dev/null || true)"
          NUM_FILES="$(printf '%s\n' "$FILES" | grep -c . || true)"
          CHANGED_LINES="$(printf '%s' "$COMPARE" | jq -r '[.files[]?.changes] | add // 0' 2>/dev/null || echo 0)"

          SENSITIVE_RE='(^|/)(\.github/|\.env|\.eslintrc|next\.config|vercel\.json|Dockerfile|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml)|src/constants/env|stripe|payment|checkout|/pocha/|order|auth|jwt|admin|session|middleware|secret|credential|migration'

          if [ "${NUM_FILES:-0}" -eq 0 ]; then
            # Could not determine the diff; fail safe to human-required.
            RISK="human-required"
          elif printf '%s\n' "$FILES" | grep -iqE "$SENSITIVE_RE"; then
            RISK="human-required"
          elif [ "${NUM_FILES:-0}" -gt 5 ] || [ "${CHANGED_LINES:-0}" -gt 150 ]; then
            RISK="complex"
          else
            RISK="simple"
          fi
          echo "Classified risk: $RISK (files=$NUM_FILES, changed_lines=$CHANGED_LINES)"

          # Title: prefer the triggering issue title; fall back to the branch.
          TITLE="${ISSUE_TITLE:-}"
          [ -z "$TITLE" ] && TITLE="Claude: ${BRANCH}"

          BODY_FILE="$(mktemp)"
          {
            echo "Risk level: ${RISK}"
            echo
            echo "## Summary"
            if [ -n "${ISSUE_NUM:-}" ]; then
              echo "Automated change by Claude Code for #${ISSUE_NUM}."
            else
              echo "Automated change by Claude Code."
            fi
            if [ -n "${ISSUE_BODY:-}" ]; then
              echo
              echo "### Request"
              printf '%s\n' "${ISSUE_BODY:0:1000}"
            fi
            echo
            echo "## Files changed (${NUM_FILES})"
            if [ -n "$FILES" ]; then
              printf '%s\n' "$FILES" | sed 's/^/- /'
            else
              echo "- (could not determine changed files)"
            fi
            echo
            echo "---"
            echo "_Risk classified automatically from changed paths. Codex review requested below. A human owner reviews and merges; nothing is auto-merged._"
          } > "$BODY_FILE"

          URL="$(gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body-file "$BODY_FILE")"
          echo "Opened draft PR: $URL"
          # Ask the official Codex GitHub app to review (works even while draft).
          gh pr comment "$URL" --body "@codex review"
