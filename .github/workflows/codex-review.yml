name: Codex review

# Codex acts as the reviewer/gatekeeper for every pull request (including those
# generated by Claude Code). It reads the declared risk level from the PR body,
# reviews the diff, and posts a non-binding verdict. It never auto-merges and
# always defers sensitive changes to a human.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract declared risk level
        id: risk
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          RISK="$(printf '%s' "$BODY" \
            | grep -ioE 'risk level:[[:space:]]*`?(simple|complex|human-required)`?' \
            | head -n 1 \
            | grep -ioE '(simple|complex|human-required)' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]' || true)"
          [ -z "${RISK:-}" ] && RISK="unspecified"
          echo "risk=$RISK" >> "$GITHUB_OUTPUT"
          echo "Declared risk level: $RISK"

      - name: Codex review
        id: codex
        uses: openai/codex-action@v1.8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          safety-strategy: drop-sudo
          output-file: ${{ runner.temp }}/codex-review.md
          prompt: |
            You are Codex, the automated reviewer and gatekeeper for pull
            requests in this repository (many are generated by Claude Code).

            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            Declared risk level: ${{ steps.risk.outputs.risk }}

            Inspect the diff for this PR:
              git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Follow the repository's CLAUDE.md and docs for conventions.

            Rules:
            - Focus on correctness, security, and whether the change does what it
              claims. Skip style nits.
            - If the declared risk is `human-required`, OR the diff touches any of:
              payments / Stripe / Pocha order state, auth / JWT / admin
              permissions, database migrations, secrets or environment variables,
              deployment config, GitHub Actions workflows, or dependency upgrades
              -> DO NOT recommend approval. Mark it for human review and say why.
            - If the declared risk is `complex`: review more deeply and list the
              specific tests that should be added or updated before approval.
            - If the declared risk is `simple` and you find no blocking issues:
              you may recommend approval, contingent on CI passing.

            Write a concise review. End with exactly one verdict line, one of:
              VERDICT: RECOMMEND APPROVE
              VERDICT: REQUEST CHANGES
              VERDICT: HUMAN REQUIRED

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RISK: ${{ steps.risk.outputs.risk }}
        run: |
          set -euo pipefail
          REVIEW="${{ runner.temp }}/codex-review.md"
          COMMENT="${{ runner.temp }}/comment.md"
          if [ ! -s "$REVIEW" ]; then
            echo "Codex did not produce any output for this run." > "$REVIEW"
          fi
          {
            echo "## Codex review"
            echo
            echo "_Declared risk level: \`${RISK}\`_"
            echo
            cat "$REVIEW"
            echo
            echo "---"
            echo "_Automated review by Codex. This is a recommendation, not a binding approval; a human owner merges. Sensitive areas always require human review._"
          } > "$COMMENT"
          gh pr comment "$PR" -R "$REPO" --body-file "$COMMENT"
