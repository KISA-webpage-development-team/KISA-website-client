name: Instagram carousel sync

on:
  schedule:
    - cron: '0 5 * * *' # daily at 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --silent

      - name: Run insta-to-carousel
        env:
          RAPIDAPI_INSTAGRAM_KEY: ${{ secrets.RAPIDAPI_INSTAGRAM_KEY }}
          RAPIDAPI_INSTAGRAM_HOST: ${{ secrets.RAPIDAPI_INSTAGRAM_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run insta:run

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: instagram-sync
          delete-branch: true
          title: 'chore: update instagram carousel (auto)'
          body: |
            Automated update of Instagram carousel data.

            This PR was automatically created by the Instagram sync workflow.
          commit-message: 'chore: update instagram carousel (auto)'
